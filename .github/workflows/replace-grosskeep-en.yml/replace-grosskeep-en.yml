name: Replace GrossKeep EN video
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move corrected video to media/grosskeep-en.mp4
        run: |
          set -e
          ls -lh media/
          test -f media/GROSSKEEP_FINAL_EN_14-NOV-2026.mp4
          rm -f media/grosskeep-en.mp4
          mv media/GROSSKEEP_FINAL_EN_14-NOV-2026.mp4 media/grosskeep-en.mp4
          ls -lh media/grosskeep-en.mp4
          test $(stat -c%s media/grosskeep-en.mp4) -gt 8000000
      - name: Commit replacement
        run: |
          git config user.name "nexaionai"
          git config user.email "nexaionai@users.noreply.github.com"
          git add -A media/
          git status --short
          git commit -m "Replace media/grosskeep-en.mp4 with corrected Punch-verified EN video" || exit 0
          git push
