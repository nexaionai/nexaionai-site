name: Rename GrossKeep videos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename videos to final names
        run: |
          git mv media/gk-en-restore.mp4 media/grosskeep-en.mp4
          git mv media/gk-es-restore.mp4 media/grosskeep-es.mp4
          git config user.name "nexaionai"
          git config user.email "nexaionai@users.noreply.github.com"
          git commit -m "Rename GrossKeep videos to grosskeep-en.mp4 and grosskeep-es.mp4"
          git push
