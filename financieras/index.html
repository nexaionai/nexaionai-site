function parseCSV(txt){

  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}

  const f={name:fname};
  {
    const rows=parseCSV(text);const H=(rows.shift()||[]).map(h=>h.trim().toLowerCase());
    const col=al=>{for(const a of al){const i=H.indexOf(a);if(i>=0)return i;}return -1;};
    const C={acct:col(["account #","account","account number","acct","acct #","acct no","cuenta","no. cuenta"]),
      amt:col(["pmt received amount","amount received","payment received","pmt amount","amount paid","amount","monto pagado","monto"]),
      first:col(["customer first","first name","first"]),last:col(["customer last","last name","last"]),name:col(["customer","customer name","cliente","name"]),
      lang:col(["language","idioma"]),phone:col(["phone","phone #","cell","telefono","teléfono"]),email:col(["email","e-mail","correo"]),
      cons:col(["text consent","sms consent","consent","consentimiento"]),status:col(["status","account status","estado"]),
      sched:col(["scheduled payment","payment","regular payment","cuota"]),next:col(["next due date","next due","first payment date","due date"]),
      cdate:col(["contract date","sale date","fecha de contrato"]),yr:col(["year"]),mk:col(["make"]),md:col(["model"]),vin:col(["vin"])};
    if(C.acct<0||(C.amt<0&&C.sched<0)){$("upRes").innerHTML=`<div class="card">${tr("upBad")}</div>`;if(inp)inp.value="";return;}
    const g=(r,i)=>i>=0?String(r[i]||"").trim():"";const num=s=>parseFloat(String(s).replace(/[$,\s]/g,""));
    const pd=s=>{const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?new Date(+m[3],+m[1]-1,+m[2]):null;};
    let res={ok:0,part:0,nf:0,dup:0,nw:0,st:0,none:0};S.notFound=S.notFound||[];
    rows.forEach(r=>{
      const id=g(r,C.acct);if(!id)return;
      const m=num(g(r,C.amt)),paid=!isNaN(m)&&m>0,stat=g(r,C.status).toLowerCase();
      let a=S.accts.find(x=>x.id.toLowerCase()===id.toLowerCase());
      if(!a){
        const due=pd(g(r,C.next)),sched=num(g(r,C.sched));
        if(!paid&&due&&!isNaN(sched)&&(stat==="new"||g(r,C.cdate))){ // contrato nuevo: entra solo
          const nm=(g(r,C.name)||(g(r,C.first)+" "+g(r,C.last))).trim()||id;
          const lang=/^(en|english|ingl)/i.test(g(r,C.lang))?"en":"es";
          const cons=/^(y|yes|s|si|sí|true|1)$/i.test(g(r,C.cons));
          a=mk(id,nm,lang,sched,due,cons,false,false,0,true,true);S.accts.unshift(a);
          EXTRA[id]=Object.assign({veh:[g(r,C.yr),g(r,C.mk),g(r,C.md)].filter(Boolean).join(" ")||"—",ph:g(r,C.phone)||"—",em:g(r,C.email),vin:g(r,C.vin),cd:g(r,C.cdate),fp:g(r,C.next),pays:[]},EXTRA[id]&&EXTRA[id].cd?{fin:EXTRA[id].fin,apr:EXTRA[id].apr,term:EXTRA[id].term,down:EXTRA[id].down}:{});
          S.tot.nuevos++;S.day.nuevos++;res.nw++;log(a,"L_newF",{f:f.name,d:new Date(due)});
        } else if(paid){S.notFound.push({a:id,m});res.nf++;}
        return;
      }
      if(/bankrupt|quiebra|bancarrota/.test(stat)&&!a.bk){a.bk=true;res.st++;log(a,"L_statF",{s:g(r,C.status)});}
      else if(/attorney|abogado/.test(stat)&&!a.abog){a.abog=true;res.st++;log(a,"L_statF",{s:g(r,C.status)});}
      if(!paid){res.none++;return;}
      if(a.match!==null){res.dup++;return;}
      post(a,f.name,m);if(m<a.cuota-0.5)res.part++;else res.ok++;
    });
    $("upRes").innerHTML=`<div class="card"><b>${tr("upTitle",{f:f.name})}</b><br>${tr("upOk",{n:res.ok})} · ${tr("upPart",{n:res.part})} · ${tr("upNew",{n:res.nw})} · ${tr("upStat",{n:res.st})} · ${tr("upNF",{n:res.nf})} · ${tr("upDup",{n:res.dup})} · ${tr("upNone",{n:res.none})}</div>`;
    if(inp)inp.value="";renderAll();
  }
}
function renderHoy(){
  renderRep();
  $("hoyTxt").textContent=today().toLocaleDateString(T[UI].loc,{weekday:"long",day:"numeric",month:"long"});
  $("today").innerHTML=kpi([[S.day.nuevos,"k_new"],[S.day.welcome,"k_wel"],[S.day.posted,"k_post"],[S.day.sent,"k_rem"],[S.day.auto,"k_ver"],[S.day.blocked,"k_blk"]]);
  const dnow=diff(today(),new Date(2026,10,13));
  const m=S.accts.filter(a=>a.match!==null&&a.partial==null);
  $("confBox").innerHTML=m.length?`<div class="sec">${tr("confH")}</div><div class="card ex"><span><b>${m.length}</b> · ${m.map(a=>a.n+" $"+a.cuota).join(" · ")}<br><span class="muted">${tr("confQ")}</span></span><button class="btn solid" onclick="confirmAll()">${tr("confAll")}</button></div>`:"";
  const ex=exceptions().filter(([a])=>a.handled===null||dnow-a.handled>=7); // llamado: no vuelve a salir por 7 días
  $("exc").innerHTML=ex.length?ex.map(([a,w])=>`<div class="card ex"><span><b>${a.n}</b> · $${a.cuota}<br><span class="muted">${w}</span></span><button class="btn" onclick="done('${a.id}')">${tr("called")}</button></div>`).join("")
    :`<div class="card"><span class="zero">0</span> <span class="muted">${tr("zero")}</span></div>`;
  const h=HIST&&S.accts.find(x=>x.id===HIST);
  const X=h&&EXTRA[h.id];
  const d1=X&&X.cd?`<div class="sec">${tr("d1H")} · ${h.n} · ${X.veh}</div><div class="card"><div style="margin-bottom:8px">${tr("d1C")}: <b>${X.cd}</b> · ${tr("d1Fin")} $${(+X.fin).toLocaleString("en-US",{minimumFractionDigits:2})} · ${X.apr}% APR · ${X.term} ${tr("d1Term")} · Down $${X.down} · ${tr("d1First")}: <b>${X.fp}</b></div><div class="muted" style="font-size:12px;margin-bottom:6px">${tr("d1Pays",{n:(X.pays||[]).length})}</div>${(X.pays||[]).length?`<table><thead><tr><th>#</th><th>${tr("colD")}</th><th>${tr("colM")}</th><th>${tr("colT")}</th></tr></thead><tbody>${X.pays.map((q,i)=>`<tr><td>${i+1}</td><td>${q[0]}</td><td>$${(+q[1]).toFixed(2)}</td><td>${q[2]}</td></tr>`).join("")}</tbody></table>`:`<span class="muted">${tr("d1No")}</span>`}</div>`:"";
  $("hist").innerHTML=h?d1+`<div class="sec">${tr("d1GK")} · ${tr("histOf",{n:h.n})}</div><div class="card"><table><tbody>${S.log.filter(l=>l.id===h.id).slice().reverse().map(l=>`<tr><td class="muted" style="width:70px">${fmt(l.d)}</td><td>${logText(l)}</td></tr>`).join("")||`<tr><td class="muted">${tr("noEv")}</td></tr>`}</tbody></table><div style="margin-top:10px"><button class="btn ghost" onclick="showHist('${h.id}')">${tr("close")}</button></div></div>`:"";
  $("cnt").textContent=S.accts.length;
  $("tb").innerHTML=S.accts.map(a=>{const[s,c]=status(a);return`<tr class="${a.bk?"bkrow":""}" style="cursor:pointer" onclick="showHist('${a.id}')"><td>${a.n}${a.isNew?` <span class="tag">${tr("newTag")}</span>`:''}<br><span class="muted">${a.id}${EXTRA[a.id]?' · '+EXTRA[a.id].veh+' · '+EXTRA[a.id].ph+(EXTRA[a.id].em?' · '+EXTRA[a.id].em:''):''}</span></td><td>$${a.cuota}</td><td>${fmt(a.due)}</td><td><span class="tag ${c}">${s}</span></td></tr>`}).join("");
}
function renderCel(){
  const sel=$("who"),cur=sel.value,w=S.accts.filter(a=>a.msgs.length);
  sel.innerHTML=w.map(a=>`<option value="${a.id}">${a.n} (${a.lang.toUpperCase()})</option>`).join("");
  if(cur&&w.some(a=>a.id===cur)) sel.value=cur;
  const a=S.accts.find(x=>x.id===sel.value);
  if(!a){$("thread").innerHTML=`<p class="muted" style="text-align:center;margin-top:120px">${tr("noMsg")}</p>`;$("pact").innerHTML="";$("ptop").textContent="";return;}
  $("ptop").textContent=fin()+" · "+tel();
  $("thread").innerHTML=a.msgs.map(m=>m.mail?`<div class="bubble mail"><div class="mh">✉ Email · ${em(a)}<br><b>${m.mail}</b></div>${m.t}<small>${fmt(m.d)} ${m.h}</small></div>`:`<div class="bubble ${m.from==="me"?"me":""}">${m.t}<small>${fmt(m.d)} ${m.h}</small></div>`).join("");
  const en=a.lang==="en";
  if(a.bk){$("pact").innerHTML=`<p style="text-align:center;margin-top:14px"><span class="tag bk">${tr("s_bk")}</span><br><span class="muted" style="font-size:12px">${tr("bkHold")}</span></p>`;return;}
  if(a.stop){$("pact").innerHTML=`<p class="muted" style="text-align:center;margin-top:14px">${tr("blocked")}</p>`;return;}
  const canPay=a.dijo===null&&late(a)>=-3;
  $("pact").innerHTML=`<div class="pbtns">${canPay?`<button class="yes" onclick="reply('${a.id}','p')">${en?"I PAID":"YA PAGUÉ"}</button>`:""}<button class="stop" onclick="reply('${a.id}','q')">${en?"QUESTION":"PREGUNTA"}</button><button class="stop" onclick="reply('${a.id}','s')">STOP</button></div>`
    +(a.dijo!==null?`<p class="muted" style="text-align:center;margin-top:10px;font-size:12px">${tr("verifying")}</p>`:"")
    +`<p style="text-align:center;margin-top:14px"><a href="#" style="color:#777;font-size:11px" onclick="event.preventDefault();bkSignal('${a.id}')">${tr("bkSim")}</a></p>`;
}
function renderDue(){
  const pend=S.accts.filter(a=>late(a)>0).length;
  const dn=diff(today(),new Date(2026,10,13));$("kpis").innerHTML=kpi([[S.dia+1,"k_days"],[S.tot.nuevos,"k_newT"],[S.tot.welcome,"k_welT"],[S.tot.preg,"k_q"],[S.tot.posted,"k_post"],[S.tot.conf,"k_conf"],[S.accts.filter(a=>a.bk).length,"k_bk"],[S.tot.sent,"k_remT"],[S.tot.auto,"k_ver"],[pend,"k_pend"],[exceptions().filter(([a])=>a.handled===null||dn-a.handled>=7).length,"k_case"],[S.tot.stops,"s_stop"]]);
}
function renderLog(){$("lg").innerHTML=S.log.map(l=>`<tr><td class="muted">${fmt(l.d)}</td><td>${l.a}</td><td>${logText(l)}</td></tr>`).join("");}
function renderAll(){renderHoy();renderCel();renderDue();renderLog();}
function setLang(l){UI=l;try{localStorage.setItem("gk-lang",l)}catch(e){}applyStatic();renderAll();}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+b.dataset.v));renderAll();});
$("l-es").onclick=()=>setLang("es");$("l-en").onclick=()=>setLang("en");
$("next").onclick=()=>{S.dia++;runDay();};
$("next7").onclick=()=>{for(let i=0;i<7;i++){S.dia++;runDay();}};
$("reset").onclick=()=>{S.notFound=[];$("upRes").innerHTML="";init();};$("pay").oninput=renderAll;$("who").onchange=renderCel;$("fin").oninput=renderAll;$("tel").oninput=renderAll;$("wd").onchange=renderAll;
try{const s=localStorage.getItem("gk-lang");if(s==="en"||s==="es")UI=s;}catch(e){}
applyStatic();init();
</script>
